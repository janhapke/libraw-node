name: build

on:
  push:
    # T23: `branches: ['**']` preserves the previous unfiltered `push: {}`
    # behaviour of triggering on a push to *any* branch (including names
    # with slashes, e.g. `task/T23-package-release`) -- per the GitHub
    # Actions push-event docs, specifying only `tags` without `branches`
    # would otherwise stop branch pushes from triggering this workflow at
    # all, which would break every existing `task/*` branch's CI run.
    # `tags: ['v*']` adds the `package` job's release trigger.
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run gen:check

      - run: ./scripts/build-linux.sh ${{ matrix.arch }}

      - run: ./scripts/check-binary.sh prebuilds/linux-${{ matrix.arch }}/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.arch }}
          path: prebuilds/linux-${{ matrix.arch }}

  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.arch }}
          path: prebuilds/linux-${{ matrix.arch }}

      - run: npm test

      # T22: Electron smoke matrix (docs/how-to/test-under-electron.md).
      # `electron` is deliberately not a package.json dependency (a
      # ~100 MB per-version download) -- install it per version, run both
      # smoke scripts under ELECTRON_RUN_AS_NODE=1 (no xvfb needed on Linux
      # runners because the addon never opens a window in that mode), then
      # repeat for the current Electron stable. electron@42 is photoview's
      # pinned version (docs/explanation/electron-compatibility.md §9).
      - name: Install electron@42
        run: npm i --no-save electron@42

      - name: Electron smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      # T24 Part A: cold-start worker_threads smoke test (no main-thread
      # warm-up require at all -- see test/electron-workers-cold-smoke.cjs's
      # header comment and docs/plan/tasks.md's T24 "Open item from T22").
      # Runs permanently (no continue-on-error) on all five test jobs; the
      # Windows job additionally reproduced the original failure and proved
      # the fix under both plain Node and Electron, 3 and 6 workers.
      - name: Cold-start worker_threads smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-cold-smoke.cjs 3

      - name: Install electron@latest
        run: npm i --no-save electron@latest

      - name: Electron smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      - name: Cold-start worker_threads smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-cold-smoke.cjs 3

      - run: ./scripts/check-binary.sh prebuilds/linux-${{ matrix.arch }}/node.napi.node

      - name: Typecheck consumer-ts example against published types
        run: |
          cd examples/consumer-ts
          npm ci
          npx tsc --noEmit

      # T24 Part B/C: electron-safety.sh and the Forge asar-packaging check
      # only need to run once (not once per Linux arch) -- x64 is the
      # natural choice since it's the first/fastest Linux runner and
      # electron-forge's own tooling (used by forge-asar-check.sh) does not
      # need to be exercised under emulation. electron-safety.sh reruns the
      # smoke scripts under the electron@latest already installed above
      # (node_modules/electron exists at this point in the job).
      - name: Electron safety check (scripts/electron-safety.sh)
        if: matrix.arch == 'x64'
        run: ./scripts/electron-safety.sh

      - name: Electron Forge asar packaging check (scripts/forge-asar-check.sh)
        if: matrix.arch == 'x64'
        run: ./scripts/forge-asar-check.sh

      # T26: every relative Markdown link/image in README.md and docs/**
      # resolves (scripts/check-links.js). x64-only, same reasoning as the
      # two Electron/Forge checks above -- this is a repo-content check, not
      # something that depends on the built binary or the CPU architecture.
      - name: Docs link check (scripts/check-links.js)
        if: matrix.arch == 'x64'
        run: npm run docs:check

  # T20: macOS x64/arm64. No Docker path here (Xcode/macOS SDK use requires
  # Apple hardware), so these run directly on the two GitHub-hosted macOS
  # runners named in docs/reference/build-matrix.md. Both targets build,
  # pass scripts/check-binary-macos.sh, and pass the full test suite with
  # OpenMP statically linked (buildInfo.openmp === true) -- see
  # docs/plan/tasks.md's T20 section for how two real bugs (an
  # otool-visible self-reference from building the addon as a dylib instead
  # of a bundle, and a LibRaw source-glob bug that let three placeholder/
  # stub files shadow real symbols on Apple's linker) were found and fixed.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: darwin-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run gen:check

      - name: Install libomp (OpenMP runtime, keg-only) and nasm (libjpeg-turbo x64 SIMD)
        run: |
          brew install libomp
          if [ "${{ matrix.target }}" = "darwin-x64" ]; then
            brew install nasm
          fi

      - name: Resolve libomp prefix
        run: echo "LIBRAW_NODE_OMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - run: ./scripts/build-native.sh ${{ matrix.target }}

      - run: otool -L prebuilds/${{ matrix.target }}/node.napi.node

      - run: ./scripts/check-binary-macos.sh prebuilds/${{ matrix.target }}/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}

  test-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: darwin-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}

      - name: Print buildInfo (records openmp true/false per target in the job log)
        run: node -e "const l=require('./lib/index.cjs');console.log(JSON.stringify(l.buildInfo))"

      - run: npm test

      # T22: Electron smoke matrix -- see the test-linux job above for the
      # full rationale; identical steps, macOS/bash shell.
      - name: Install electron@42
        run: npm i --no-save electron@42

      - name: Electron smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      # T24 Part A: cold-start worker_threads smoke test -- see the
      # test-linux job's identical step for the full rationale.
      - name: Cold-start worker_threads smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-cold-smoke.cjs 3

      - name: Install electron@latest
        run: npm i --no-save electron@latest

      - name: Electron smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      - name: Cold-start worker_threads smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-cold-smoke.cjs 3

      - run: otool -L prebuilds/${{ matrix.target }}/node.napi.node

  # T21: win32-x64. windows-2022 runner (docs/reference/build-matrix.md). No
  # Docker/cross path here either -- MSVC only targets Windows from a
  # Windows host, same reasoning as build-macos (T20) for Darwin. Two
  # Windows-specific pieces build-native.sh/build-linux.sh never needed:
  # (1) node.lib, synthesized from node-api-headers' .def files with lib.exe
  # (no libnode/node.lib to link against otherwise -- see
  # scripts/build-native.ps1 and CMakeLists.txt's WIN32 link arm), and
  # (2) the win_delay_load_hook.cc + /DELAYLOAD:node.exe pair that makes the
  # addon load under Electron (electron.exe, not node.exe) --
  # docs/how-to/make-the-addon-electron-safe.md row 3 /
  # docs/explanation/electron-compatibility.md §3.
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        shell: bash
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run gen:check

      # Puts cl.exe/lib.exe/link.exe/dumpbin.exe/nmake.exe on PATH for every
      # subsequent step in this job (a Developer Command Prompt environment,
      # without needing to wrap each step in vcvarsall.bat by hand).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # libjpeg-turbo's WITH_SIMD=ON x64 SIMD extensions are written in NASM,
      # not inline/intrinsic asm -- same requirement build-native.sh covers
      # with `brew install nasm` on macOS x64 (T20).
      - uses: ilammy/setup-nasm@v1

      # windows-2022 runner images generally ship Ninja already, but install
      # explicitly so this doesn't depend on that image detail -- Ninja is
      # the single-config generator scripts/build-native.ps1 picks (see its
      # header comment for why, vs. the default multi-config
      # "Visual Studio 17 2022" generator).
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Build native addon (win32-x64)
        run: ./scripts/build-native.ps1 -Target win32-x64

      - name: dumpbin /DEPENDENTS
        run: dumpbin /DEPENDENTS prebuilds/win32-x64/node.napi.node /nologo

      - name: "dumpbin /IMPORTS (delay-load node.exe excerpt)"
        run: dumpbin /IMPORTS prebuilds/win32-x64/node.napi.node /nologo | Select-String -Context 0,3 "node.exe"

      - name: dumpbin /EXPORTS
        run: dumpbin /EXPORTS prebuilds/win32-x64/node.napi.node /nologo

      - run: ./scripts/check-binary-windows.ps1 -FilePath prebuilds/win32-x64/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/win32-x64

  test-windows:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        shell: bash
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/win32-x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Print buildInfo (records openmp true/false and the exact flags in the job log)
        run: node -e "const l=require('./lib/index.cjs');console.log(JSON.stringify(l.buildInfo))"

      - run: npm test

      # T24b: diagnostic variant table (docs/plan/tasks.md's T24b section --
      # the STATUS_ACCESS_VIOLATION crash investigation and fix). Runs
      # test/helpers/run-variants.cjs, which spawns ten lettered variants
      # (a)-(j) of test/helpers/cold-variant.cjs as fresh `node` child
      # processes and prints a `VARIANT <letter> exit=<code>` table -- kept
      # permanently as a cheap, high-signal regression guard (this driver
      # always exits 0 itself; see its header comment) now that all ten
      # variants are green.
      - name: "T24b diagnostics: cold-start worker_threads variant table"
        shell: pwsh
        run: node test/helpers/run-variants.cjs

      # T24 Part A: the "Open item from T22" cold-start reproduction, kept
      # permanently as a regression guard (docs/plan/tasks.md's T24 and T24b
      # sections have the full investigation). Runs under plain Node
      # *before* Electron enters the picture at all -- this reproduced
      # identically under plain Node too (not only Electron), which ruled
      # out the Electron-vs-node.exe redirect as the cause. The real root
      # cause (T24b) was a Windows /openmp (vcomp140.dll) runtime crash on
      # cold worker_threads, fixed in src/win_delay_load_hook.cc +
      # CMakeLists.txt (delay-loading VCOMP140.DLL so this addon's own
      # DllMain can force single-threaded OpenMP before vcomp ever reads
      # OMP_NUM_THREADS). NODE_OPTIONS=--trace-uncaught is kept from the
      # investigation (cheap insurance -- surfaces a stack trace for
      # anything that would otherwise die silently).
      - name: Cold-start worker_threads smoke test (plain node, 3 workers)
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = "--trace-uncaught"
          node test/electron-workers-cold-smoke.cjs 3

      - name: Cold-start worker_threads smoke test (plain node, 6 workers)
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = "--trace-uncaught"
          node test/electron-workers-cold-smoke.cjs 6

      # T22: Electron smoke matrix -- see the test-linux job above for the
      # full rationale. Windows steps use pwsh explicitly and set
      # $env:ELECTRON_RUN_AS_NODE (the bash `FOO=1 cmd` prefix syntax used
      # on Linux/macOS is not portable to PowerShell). GitHub Actions checks
      # $LASTEXITCODE after a pwsh step's final command, so a failing
      # smoke script still fails the step.
      - name: Install electron@42
        shell: pwsh
        run: npm i --no-save electron@42

      - name: Electron smoke test (electron@42)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@42)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-workers-smoke.cjs

      # T24 Part A: same cold-start regression guard as above, this time
      # under Electron 42 (photoview's pinned version) -- the exact
      # scenario the "Open item from T22" was found in.
      - name: Cold-start worker_threads smoke test (electron@42, 3 workers)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_OPTIONS = "--trace-uncaught"
          npx electron test/electron-workers-cold-smoke.cjs 3

      - name: Cold-start worker_threads smoke test (electron@42, 6 workers)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_OPTIONS = "--trace-uncaught"
          npx electron test/electron-workers-cold-smoke.cjs 6

      - name: Install electron@latest
        shell: pwsh
        run: npm i --no-save electron@latest

      - name: Electron smoke test (electron@latest)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@latest)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-workers-smoke.cjs

      # T24 Part A: same cold-start regression guard under the current
      # Electron stable too.
      - name: Cold-start worker_threads smoke test (electron@latest, 3 workers)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_OPTIONS = "--trace-uncaught"
          npx electron test/electron-workers-cold-smoke.cjs 3

      - name: Cold-start worker_threads smoke test (electron@latest, 6 workers)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:NODE_OPTIONS = "--trace-uncaught"
          npx electron test/electron-workers-cold-smoke.cjs 6

      - name: dumpbin /DEPENDENTS
        run: dumpbin /DEPENDENTS prebuilds/win32-x64/node.napi.node /nologo

  # T23: packaging, provenance, release dry run. Waits on every test job
  # (all five platforms actually decoding real prebuilds, not just the
  # build jobs producing them) before assembling the publishable tarball,
  # so a `package` green run is real end-to-end evidence, not just "five
  # binaries compiled". Runs on ubuntu-24.04 like the other Linux-hosted
  # jobs; checks out with submodules because scripts/gen-notices.js reads
  # licence files out of vendor/LibRaw, vendor/zlib, vendor/libjpeg-turbo
  # directly (see that script's header comment for the full input list).
  package:
    needs: [test-linux, test-macos, test-windows]
    runs-on: ubuntu-24.04
    # id-token: write is required for `npm publish --provenance` (OIDC-based
    # Sigstore attestation to the npm registry); contents: read is the
    # narrowest read this job needs beyond that (checkout).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Required by `npm publish --provenance`: without a registry-url
          # here, setup-node does not write the .npmrc auth/registry config
          # npm needs to attach a provenance attestation on publish.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Five separate downloads (one per build-linux/build-macos/build-windows
      # artifact name) rather than a single glob download: the artifact
      # names (prebuilds-linux-x64, prebuilds-linux-arm64,
      # prebuilds-darwin-x64, prebuilds-darwin-arm64, prebuilds-win32-x64)
      # already carry the exact prebuilds/<target> layout node-gyp-build
      # expects, so each just needs unpacking into its matching directory.
      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-linux-x64
          path: prebuilds/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-linux-arm64
          path: prebuilds/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-darwin-x64
          path: prebuilds/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-darwin-arm64
          path: prebuilds/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/win32-x64

      - run: ls -R prebuilds

      - name: Regenerate THIRD_PARTY_NOTICES.md and check it matches what's committed
        run: node scripts/gen-notices.js --check

      - name: npm pack --dry-run (report package/unpacked size without writing a tarball)
        run: |
          node -e "
            const { execFileSync } = require('node:child_process');
            const out = execFileSync('npm', ['pack', '--dry-run', '--json'], { encoding: 'utf8' });
            const [info] = JSON.parse(out);
            const fmt = (n) => (n / 1024 / 1024).toFixed(2) + ' MiB';
            console.log('npm pack --dry-run: ' + info.filename);
            console.log('  entries: ' + info.entryCount);
            console.log('  package size (compressed): ' + fmt(info.size));
            console.log('  unpacked size: ' + fmt(info.unpackedSize));
          "

      - name: npm pack (writes the real tarball)
        id: pack
        run: |
          OUT=$(npm pack --json)
          echo "$OUT" > /tmp/npm-pack.json
          FILENAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/npm-pack.json','utf8'))[0].filename)")
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          ls -lh "$FILENAME"

      # Proves the packed tarball -- not the repo checkout -- actually
      # resolves and loads a prebuild: a fresh temp directory, a real `npm
      # install` of the tarball (exercising package.json's `files`/`exports`
      # the same way a real consumer would), then both module systems plus
      # a decodeSync sanity check that the native addon actually loaded
      # (decodeSync existing as a function proves node-gyp-build resolved
      # prebuilds/linux-x64/node.napi.node from inside node_modules and the
      # addon's N-API entry point ran without throwing).
      - name: verify-package (install the tarball fresh and sanity-check it loads)
        run: |
          set -euo pipefail
          TARBALL="$PWD/${{ steps.pack.outputs.filename }}"
          VERIFY_DIR=$(mktemp -d)
          cd "$VERIFY_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --omit=dev "$TARBALL"
          echo '--- ESM import ---'
          node --input-type=module -e "import { decode } from '@janhapke/libraw'; if (typeof decode !== 'function') throw new Error('decode is not a function'); console.log('ESM import OK: typeof decode ===', typeof decode);"
          echo '--- CJS require ---'
          node -e "const l = require('@janhapke/libraw'); if (typeof l.decode !== 'function') throw new Error('decode is not a function'); console.log('CJS require OK: typeof decode ===', typeof l.decode);"
          echo '--- decodeSync sanity (proves the packed prebuild actually loaded) ---'
          node -e "const l = require('@janhapke/libraw'); if (typeof l.decodeSync !== 'function') throw new Error('decodeSync missing'); console.log('decodeSync OK, buildInfo =', JSON.stringify(l.buildInfo));"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'

      # Publish guard: only on a `v*` tag push, and only if the tag's
      # version actually matches package.json's version -- a mistagged
      # release (e.g. tagging v0.2.0 before bumping package.json) must fail
      # loudly here rather than publish the wrong version number.
      - name: Verify tag version matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package.json version $PKG_VERSION -- refusing to publish"
            exit 1
          fi
          echo "tag v$TAG_VERSION matches package.json version $PKG_VERSION"

      - name: npm publish --provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
