name: build

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run gen:check

      - run: ./scripts/build-linux.sh ${{ matrix.arch }}

      - run: ./scripts/check-binary.sh prebuilds/linux-${{ matrix.arch }}/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.arch }}
          path: prebuilds/linux-${{ matrix.arch }}

  test-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.arch }}
          path: prebuilds/linux-${{ matrix.arch }}

      - run: npm test

      # T22: Electron smoke matrix (docs/how-to/test-under-electron.md).
      # `electron` is deliberately not a package.json dependency (a
      # ~100 MB per-version download) -- install it per version, run both
      # smoke scripts under ELECTRON_RUN_AS_NODE=1 (no xvfb needed on Linux
      # runners because the addon never opens a window in that mode), then
      # repeat for the current Electron stable. electron@42 is photoview's
      # pinned version (docs/explanation/electron-compatibility.md §9).
      - name: Install electron@42
        run: npm i --no-save electron@42

      - name: Electron smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      - name: Install electron@latest
        run: npm i --no-save electron@latest

      - name: Electron smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      - run: ./scripts/check-binary.sh prebuilds/linux-${{ matrix.arch }}/node.napi.node

      - name: Typecheck consumer-ts example against published types
        run: |
          cd examples/consumer-ts
          npm ci
          npx tsc --noEmit

  # T20: macOS x64/arm64. No Docker path here (Xcode/macOS SDK use requires
  # Apple hardware), so these run directly on the two GitHub-hosted macOS
  # runners named in docs/reference/build-matrix.md. Both targets build,
  # pass scripts/check-binary-macos.sh, and pass the full test suite with
  # OpenMP statically linked (buildInfo.openmp === true) -- see
  # docs/plan/tasks.md's T20 section for how two real bugs (an
  # otool-visible self-reference from building the addon as a dylib instead
  # of a bundle, and a LibRaw source-glob bug that let three placeholder/
  # stub files shadow real symbols on Apple's linker) were found and fixed.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: darwin-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run gen:check

      - name: Install libomp (OpenMP runtime, keg-only) and nasm (libjpeg-turbo x64 SIMD)
        run: |
          brew install libomp
          if [ "${{ matrix.target }}" = "darwin-x64" ]; then
            brew install nasm
          fi

      - name: Resolve libomp prefix
        run: echo "LIBRAW_NODE_OMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - run: ./scripts/build-native.sh ${{ matrix.target }}

      - run: otool -L prebuilds/${{ matrix.target }}/node.napi.node

      - run: ./scripts/check-binary-macos.sh prebuilds/${{ matrix.target }}/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}

  test-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: darwin-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/${{ matrix.target }}

      - name: Print buildInfo (records openmp true/false per target in the job log)
        run: node -e "const l=require('./lib/index.cjs');console.log(JSON.stringify(l.buildInfo))"

      - run: npm test

      # T22: Electron smoke matrix -- see the test-linux job above for the
      # full rationale; identical steps, macOS/bash shell.
      - name: Install electron@42
        run: npm i --no-save electron@42

      - name: Electron smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@42)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      - name: Install electron@latest
        run: npm i --no-save electron@latest

      - name: Electron smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@latest)
        run: ELECTRON_RUN_AS_NODE=1 npx electron test/electron-workers-smoke.cjs

      - run: otool -L prebuilds/${{ matrix.target }}/node.napi.node

  # T21: win32-x64. windows-2022 runner (docs/reference/build-matrix.md). No
  # Docker/cross path here either -- MSVC only targets Windows from a
  # Windows host, same reasoning as build-macos (T20) for Darwin. Two
  # Windows-specific pieces build-native.sh/build-linux.sh never needed:
  # (1) node.lib, synthesized from node-api-headers' .def files with lib.exe
  # (no libnode/node.lib to link against otherwise -- see
  # scripts/build-native.ps1 and CMakeLists.txt's WIN32 link arm), and
  # (2) the win_delay_load_hook.cc + /DELAYLOAD:node.exe pair that makes the
  # addon load under Electron (electron.exe, not node.exe) --
  # docs/how-to/make-the-addon-electron-safe.md row 3 /
  # docs/explanation/electron-compatibility.md §3.
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned Node version
        shell: bash
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run gen:check

      # Puts cl.exe/lib.exe/link.exe/dumpbin.exe/nmake.exe on PATH for every
      # subsequent step in this job (a Developer Command Prompt environment,
      # without needing to wrap each step in vcvarsall.bat by hand).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # libjpeg-turbo's WITH_SIMD=ON x64 SIMD extensions are written in NASM,
      # not inline/intrinsic asm -- same requirement build-native.sh covers
      # with `brew install nasm` on macOS x64 (T20).
      - uses: ilammy/setup-nasm@v1

      # windows-2022 runner images generally ship Ninja already, but install
      # explicitly so this doesn't depend on that image detail -- Ninja is
      # the single-config generator scripts/build-native.ps1 picks (see its
      # header comment for why, vs. the default multi-config
      # "Visual Studio 17 2022" generator).
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Build native addon (win32-x64)
        run: ./scripts/build-native.ps1 -Target win32-x64

      - name: dumpbin /DEPENDENTS
        run: dumpbin /DEPENDENTS prebuilds/win32-x64/node.napi.node /nologo

      - name: "dumpbin /IMPORTS (delay-load node.exe excerpt)"
        run: dumpbin /IMPORTS prebuilds/win32-x64/node.napi.node /nologo | Select-String -Context 0,3 "node.exe"

      - name: dumpbin /EXPORTS
        run: dumpbin /EXPORTS prebuilds/win32-x64/node.napi.node /nologo

      - run: ./scripts/check-binary-windows.ps1 -FilePath prebuilds/win32-x64/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/win32-x64

  test-windows:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        shell: bash
        run: grep '^NODE_VERSION=' scripts/versions.env | cut -d= -f2 | sed 's/^/NODE_VERSION=/' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: prebuilds-win32-x64
          path: prebuilds/win32-x64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Print buildInfo (records openmp true/false and the exact flags in the job log)
        run: node -e "const l=require('./lib/index.cjs');console.log(JSON.stringify(l.buildInfo))"

      - run: npm test

      # T22: Electron smoke matrix -- see the test-linux job above for the
      # full rationale. Windows steps use pwsh explicitly and set
      # $env:ELECTRON_RUN_AS_NODE (the bash `FOO=1 cmd` prefix syntax used
      # on Linux/macOS is not portable to PowerShell). GitHub Actions checks
      # $LASTEXITCODE after a pwsh step's final command, so a failing
      # smoke script still fails the step.
      - name: Install electron@42
        shell: pwsh
        run: npm i --no-save electron@42

      - name: Electron smoke test (electron@42)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@42)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-workers-smoke.cjs

      - name: Install electron@latest
        shell: pwsh
        run: npm i --no-save electron@latest

      - name: Electron smoke test (electron@latest)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-smoke.cjs

      - name: Electron worker_threads smoke test (electron@latest)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          npx electron test/electron-workers-smoke.cjs

      - name: dumpbin /DEPENDENTS
        run: dumpbin /DEPENDENTS prebuilds/win32-x64/node.napi.node /nologo
